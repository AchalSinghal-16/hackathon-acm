{% extends 'base.html' %}{% block main %}
<main class="wrap"><h1 class="pt">Team registration</h1><p class="prose">Teams have 2 to 4 members. Saving again replaces your previous entry.</p>
<form method="post" class="panel"><input type="hidden" name="csrf" value="{{ csrf() }}">
 <label>Team name<input name="team_name" required></label><label>College<input name="college"></label>
 <label>Project idea (optional)<textarea name="idea" rows="3"></textarea></label>
 {% for i in range(4) %}<fieldset><legend>Member {{ i+1 }}{{ ' (you)' if i==0 }}</legend>
  <input name="m_name" placeholder="Name" value="{{ me.name if i==0 }}" {{ 'required' if i<2 }}><input name="m_email" type="email" placeholder="College email" value="{{ me.email if i==0 }}"></fieldset>{% endfor %}
 <button class="btn-main" type="submit">Register team</button></form></main>{% endblock %}
